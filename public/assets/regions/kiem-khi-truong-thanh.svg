<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-truong-thanh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f0f0c"/>
      <stop offset="60%" stop-color="#3d1c15"/>
      <stop offset="100%" stop-color="#120907"/>
    </linearGradient>
    <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2221"/>
      <stop offset="100%" stop-color="#0d0908"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#sky-truong-thanh)"/>

  <!-- Bụi cát & mây đỏ chiến trường Man Hoang -->
  <path d="M0 220 Q200 160 450 190 T900 150 T1200 190 L1200 400 L0 400 Z" fill="#2d130e" opacity="0.6"/>

  <!-- Tường Thành Kiếm Khí Đá Đen Vạn Trượng -->
  <path d="M0 260 L80 260 L80 280 L160 280 L160 260 L240 260 L240 280 L320 280 L320 260 L400 260 L400 280 L480 280 L480 260 L560 260 L560 280 L640 280 L640 260 L720 260 L720 280 L800 280 L800 260 L880 260 L880 280 L960 280 L960 260 L1040 260 L1040 280 L1120 280 L1120 260 L1200 260 L1200 400 L0 400 Z" fill="url(#wall-grad)"/>

  <!-- Vết kiếm chém đỏ rực trên mặt thành -->
  <g stroke="#d1443b" stroke-width="2" opacity="0.75" stroke-linecap="round">
    <path d="M140 290 L190 350 M320 300 L280 370 M550 280 L620 340 M820 290 L760 360 M1020 310 L1080 370" />
    <path d="M420 320 L470 340 M700 310 L750 330" stroke="#f2ede4" stroke-width="1.5" opacity="0.6" />
  </g>

  <!-- Kiếm quang lóe sáng trên bầu trời -->
  <g opacity="0.8">
    <path d="M300 120 L380 90" stroke="#e0bf4a" stroke-width="2" stroke-dasharray="8 6"/>
    <path d="M720 80 L820 60" stroke="#f2ede4" stroke-width="2" stroke-dasharray="10 8"/>
    <path d="M940 140 L1010 110" stroke="#d1443b" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
</svg>
